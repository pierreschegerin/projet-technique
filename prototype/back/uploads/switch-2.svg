<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="zeldaBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>
    <linearGradient id="marioBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="#f8fafc"/>

  <!-- Dock on the left -->
  <rect x="80" y="240" width="280" height="200" rx="10" fill="#27272a"/>
  <rect x="80" y="270" width="280" height="8" fill="#18181b"/>
  <circle cx="110" cy="410" r="4" fill="#22c55e"/>
  <text x="220" y="360" font-family="sans-serif" font-size="14" font-weight="bold" fill="#71717a" text-anchor="middle">NINTENDO SWITCH DOCK</text>

  <!-- Game 1: Zelda Box -->
  <rect x="420" y="200" width="140" height="230" rx="8" fill="url(#zeldaBg)" stroke="#065f46" stroke-width="3"/>
  <rect x="430" y="210" width="120" height="30" rx="4" fill="#eab308"/>
  <text x="490" y="230" font-family="sans-serif" font-size="12" font-weight="bold" fill="#78350f" text-anchor="middle">ZELDA</text>
  <text x="490" y="280" font-family="sans-serif" font-size="11" fill="#ecfdf5" text-anchor="middle">BREATH OF</text>
  <text x="490" y="298" font-family="sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">THE WILD</text>
  <text x="490" y="390" font-family="sans-serif" font-size="28" text-anchor="middle">🗡️</text>

  <!-- Game 2: Mario Kart 8 Box -->
  <rect x="580" y="200" width="140" height="230" rx="8" fill="url(#marioBg)" stroke="#991b1b" stroke-width="3"/>
  <rect x="590" y="210" width="120" height="30" rx="4" fill="#ffffff"/>
  <text x="650" y="230" font-family="sans-serif" font-size="11" font-weight="bold" fill="#dc2626" text-anchor="middle">MARIO KART 8</text>
  <text x="650" y="285" font-family="sans-serif" font-size="12" font-weight="bold" fill="#fef2f2" text-anchor="middle">DELUXE</text>
  <text x="650" y="390" font-family="sans-serif" font-size="28" text-anchor="middle">🏎️</text>

  <!-- Badge / Label -->
  <rect x="30" y="30" width="250" height="42" rx="21" fill="#ffffff" opacity="0.95"/>
  <text x="155" y="57" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="bold" fill="#334155" text-anchor="middle">DOCK &amp; JEUX INCLUS</text>
</svg>
