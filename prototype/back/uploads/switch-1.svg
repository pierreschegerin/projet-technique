<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="switchScreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="#f1f5f9"/>

  <!-- Shadow -->
  <rect x="130" y="440" width="540" height="30" rx="15" fill="#000000" opacity="0.12"/>

  <!-- Switch Console Body -->
  <!-- Left Joy-Con (Neon Blue) -->
  <path d="M 180 180 
           L 240 180 
           L 240 420 
           L 180 420 
           C 140 420, 140 180, 180 180 Z" 
        fill="#0ea5e9" stroke="#0284c7" stroke-width="3"/>
  <!-- Left Stick & buttons -->
  <circle cx="190" cy="240" r="20" fill="#1e293b"/>
  <circle cx="190" cy="240" r="14" fill="#334155"/>
  <!-- D-Pad buttons -->
  <circle cx="190" cy="320" r="6" fill="#1e293b"/>
  <circle cx="175" cy="335" r="6" fill="#1e293b"/>
  <circle cx="205" cy="335" r="6" fill="#1e293b"/>
  <circle cx="190" cy="350" r="6" fill="#1e293b"/>
  <!-- Minus button -->
  <rect x="210" y="200" width="12" height="4" rx="2" fill="#1e293b"/>

  <!-- Main Screen Body (Bezel) -->
  <rect x="240" y="180" width="320" height="240" rx="6" fill="#27272a"/>
  <!-- Active Screen Area -->
  <rect x="270" y="200" width="260" height="200" rx="3" fill="url(#switchScreen)"/>
  <!-- Nintendo Logo on Screen -->
  <circle cx="390" cy="300" r="28" fill="none" stroke="#ef4444" stroke-width="6"/>
  <circle cx="390" cy="290" r="7" fill="#ef4444"/>
  <circle cx="415" cy="300" r="28" fill="none" stroke="#ef4444" stroke-width="6"/>
  <circle cx="415" cy="310" r="7" fill="#ef4444"/>

  <!-- Right Joy-Con (Neon Red) -->
  <path d="M 560 180 
           L 620 180 
           C 660 180, 660 420, 620 420 
           L 560 420 Z" 
        fill="#ef4444" stroke="#dc2626" stroke-width="3"/>
  <!-- ABXY buttons -->
  <circle cx="610" cy="230" r="6" fill="#1e293b"/>
  <circle cx="595" cy="245" r="6" fill="#1e293b"/>
  <circle cx="625" cy="245" r="6" fill="#1e293b"/>
  <circle cx="610" cy="260" r="6" fill="#1e293b"/>
  <!-- Right Stick -->
  <circle cx="610" cy="330" r="20" fill="#1e293b"/>
  <circle cx="610" cy="330" r="14" fill="#334155"/>
  <!-- Plus button -->
  <text x="590" y="210" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1e293b">+</text>

  <!-- Badge / Label -->
  <rect x="30" y="30" width="250" height="42" rx="21" fill="#ffffff" opacity="0.95"/>
  <text x="155" y="57" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="bold" fill="#ef4444" text-anchor="middle">NINTENDO SWITCH</text>
</svg>
