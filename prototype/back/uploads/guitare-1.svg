<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="wood" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="pickguard" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#78350f"/>
      <stop offset="100%" stop-color="#451a03"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="#fdfbf7"/>

  <!-- Subtle shadow -->
  <ellipse cx="400" cy="510" rx="260" ry="20" fill="#000000" opacity="0.08"/>

  <!-- Guitar (Horizontal angle) -->
  <g transform="translate(400, 290) rotate(-18) translate(-400, -290)">
    <!-- Lower Body -->
    <path d="M 230 290 
             C 210 210, 280 180, 370 200 
             C 410 210, 430 240, 440 260 
             C 450 240, 470 210, 520 220 
             C 580 230, 610 300, 580 370 
             C 550 430, 470 410, 440 370 
             C 420 390, 390 410, 350 410 
             C 260 410, 210 360, 230 290 Z" 
          fill="url(#wood)" stroke="#78350f" stroke-width="6"/>

    <!-- Sound hole -->
    <circle cx="480" cy="300" r="45" fill="#1c1917" stroke="#fbbf24" stroke-width="4"/>
    <circle cx="480" cy="300" r="55" fill="none" stroke="#fef3c7" stroke-width="2"/>

    <!-- Pickguard -->
    <path d="M 485 345 C 520 345, 545 320, 535 285 C 530 270, 500 270, 490 270 Z" fill="url(#pickguard)"/>

    <!-- Bridge -->
    <rect x="340" y="280" width="22" height="60" rx="4" fill="#3f2314"/>
    <rect x="348" y="286" width="6" height="48" rx="2" fill="#fafaf9"/>

    <!-- Neck -->
    <rect x="540" y="287" width="210" height="26" fill="#78350f" stroke="#451a03" stroke-width="2"/>
    
    <!-- Frets -->
    <line x1="570" y1="287" x2="570" y2="313" stroke="#e2e8f0" stroke-width="2"/>
    <line x1="605" y1="287" x2="605" y2="313" stroke="#e2e8f0" stroke-width="2"/>
    <line x1="645" y1="287" x2="645" y2="313" stroke="#e2e8f0" stroke-width="2"/>
    <line x1="690" y1="287" x2="690" y2="313" stroke="#e2e8f0" stroke-width="2"/>

    <!-- Headstock -->
    <polygon points="750,283 820,275 830,325 750,317" fill="#b45309" stroke="#451a03" stroke-width="3"/>
    <text x="785" y="304" font-family="sans-serif" font-size="9" font-weight="bold" fill="#fef3c7" text-anchor="middle">YAMAHA</text>

    <!-- Strings -->
    <line x1="351" y1="290" x2="800" y2="289" stroke="#f8fafc" stroke-width="1.8" opacity="0.9"/>
    <line x1="351" y1="294" x2="800" y2="293" stroke="#f8fafc" stroke-width="1.5" opacity="0.9"/>
    <line x1="351" y1="298" x2="800" y2="297" stroke="#f8fafc" stroke-width="1.3" opacity="0.9"/>
    <line x1="351" y1="302" x2="800" y2="301" stroke="#f8fafc" stroke-width="1.1" opacity="0.9"/>
    <line x1="351" y1="306" x2="800" y2="305" stroke="#f8fafc" stroke-width="1.0" opacity="0.9"/>
    <line x1="351" y1="310" x2="800" y2="309" stroke="#f8fafc" stroke-width="0.8" opacity="0.9"/>
  </g>

  <!-- Badge / Label -->
  <rect x="30" y="30" width="220" height="42" rx="21" fill="#ffffff" opacity="0.95"/>
  <text x="140" y="57" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="bold" fill="#b45309" text-anchor="middle">YAMAHA F310</text>
</svg>
